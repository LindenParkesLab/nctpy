[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nctpy"
dynamic = ["version"]
description = "Python implementation of concepts from network control theory"
readme = { file = "README.rst", content-type = "text/x-rst" }
authors = [
    { name = "Linden Parkes", email = "lindenparkes@gmail.com" },
    { name = "Jason Kim", email = "jinsu1@seas.upenn.edu" },
    { name = "Jennifer Stiso", email = "jeni.stiso@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "statsmodels",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# nctpy.plotting
plot = ["matplotlib", "seaborn", "nibabel", "nilearn"]
# everything the Nature Protocols paper's printed code imports (its import block also uses pandas
# and scikit-learn): `pip install "nctpy[paper]"` is enough to run it
paper = ["nctpy[plot]", "pandas", "scikit-learn"]
docs = ["sphinx", "sphinx-rtd-theme"]
dev = ["nctpy[paper]", "pytest", "pytest-cov", "nbclient", "nbformat", "ipykernel", "pre-commit"]

[project.urls]
Homepage = "https://github.com/LindenParkesLab/nctpy"
"Bug Tracker" = "https://github.com/LindenParkesLab/nctpy/issues"

[tool.setuptools.dynamic]
version = { attr = "nctpy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
# the published packages: nctpy (with nctpy.null_models) and the top-level `null_models`, an import path
# printed in the protocol paper
include = ["nctpy", "nctpy.*", "null_models"]

[tool.setuptools.package-data]
# PEP 561: nctpy ships type annotations (modules are annotated as Phase 2 reaches them)
nctpy = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
# apply the excludes below even when files are named explicitly (as pre-commit does)
force-exclude = true
# notebooks and the paper's scripts are records, not linted code
extend-exclude = ["*.ipynb", "scripts", "docs"]

[tool.ruff.lint]
# ruff's default rule set, stated explicitly so results do not depend on anyone's personal ruff config
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing violations, removed module by module in Phase 2 with the tests watching. Some are
# behaviour-sensitive (e.g. utils.py's "unused" `from scipy import stats` loads the submodule that
# `sp.stats` relies on on older SciPy), so they are not auto-fixed here. New code must pass.
"src/nctpy/utils.py" = ["E741"]  # E741: `l` is a released, frozen parameter name
"src/tests/test_nctpy.py" = ["E741"]

[tool.ruff.format]
# Files not yet in ruff's format. Phase 2 formats each module as it refactors it and removes its entry;
# anything not listed here (i.e. every new file) must be formatted.
exclude = [
    "src/null_models/geomsurr.py",
    "src/tests/make_api_contract.py",
    "src/tests/make_geomsurr_fixtures.py",
    "src/tests/make_regression_fixtures.py",
    "src/tests/test_api_contract.py",
    "src/tests/test_nctpy.py",
    "src/tests/test_notebooks.py",
    "src/tests/test_paper_code.py",
    "src/tests/test_plotting.py",
    "src/tests/test_properties.py",
    "src/tests/test_regression.py",
]

[tool.mypy]
files = ["src/nctpy", "src/null_models"]
# most dependencies (nilearn, nibabel, seaborn, statsmodels) ship no type information
ignore_missing_imports = true
