[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nctpy"
dynamic = ["version"]
description = "Python implementation of concepts from network control theory"
readme = { file = "README.rst", content-type = "text/x-rst" }
authors = [
    { name = "Linden Parkes", email = "lindenparkes@gmail.com" },
    { name = "Jason Kim", email = "jinsu1@seas.upenn.edu" },
    { name = "Jennifer Stiso", email = "jeni.stiso@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "packaging",
    "statsmodels",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# nctpy.plotting
plot = ["matplotlib", "seaborn", "nibabel", "nilearn"]
# everything the Nature Protocols paper's printed code imports (its import block also uses pandas
# and scikit-learn): `pip install "nctpy[paper]"` is enough to run it
paper = ["nctpy[plot]", "pandas", "scikit-learn"]
docs = ["sphinx", "sphinx-rtd-theme"]
dev = ["nctpy[paper]", "pytest", "pytest-cov", "nbclient", "nbformat", "ipykernel"]

[project.urls]
Homepage = "https://github.com/LindenParkesLab/nctpy"
"Bug Tracker" = "https://github.com/LindenParkesLab/nctpy/issues"

[tool.setuptools.dynamic]
version = { attr = "nctpy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
# the published packages; `null_models` is a top-level import path printed in the protocol paper
include = ["nctpy", "null_models"]
