name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # ruff is pinned to the version in .pre-commit-config.yaml, so local and CI checks agree
      - run: python -m pip install . ruff==0.16.9 mypy
      # ruff skips hidden directories such as .github/, so the release scripts are named explicitly
      - name: ruff check
        run: ruff check . .github/scripts/*.py
      - name: ruff format --check
        run: ruff format --check . .github/scripts/*.py
      - name: mypy
        run: mypy

  test:
    # Tests the built wheel, not the checkout. The paper-code and notebook tests need the paper's
    # data, which is not in the repository, so they skip here and run locally before a release.
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}, numpy ${{ matrix.numpy }}.x)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        numpy: ["1", "2"]
        exclude:
          - python: "3.13"  # numpy 1.x has no Python 3.13 builds
            numpy: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: install the wheel with the dev extra
        shell: bash
        run: |
          if [ "${{ matrix.numpy }}" = "1" ]; then NUMPY="numpy<2"; else NUMPY="numpy>=2"; fi
          python -m pip install "$(ls dist/*.whl)[dev]" "$NUMPY"
          python -m pip list
      - name: check the tests will import the installed package
        working-directory: src/tests
        run: python -c "import nctpy; assert 'site-packages' in nctpy.__file__, nctpy.__file__; print(nctpy.__file__)"
      - name: pytest
        working-directory: src/tests
        run: python -m pytest -q -p no:cacheprovider -rs

  docs:
    # Builds the documentation the way Read the Docs does (.readthedocs.yaml), with warnings as errors.
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: sphinx-build (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

  coverage:
    # Coverage must not fall below the baseline recorded in src/tests/baseline.json ("public").
    name: coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: build and install the wheel with the dev extra
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m pip install "$(ls dist/*.whl)[dev]"
      - name: install CPU-only PyTorch, so nctpy.optimize is tested here (the test matrix skips it)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: pytest with coverage
        working-directory: src/tests
        run: python -m pytest -q -p no:cacheprovider --cov=nctpy --cov=null_models --cov-branch --cov-report=term --cov-report=json:coverage.json
      - name: compare with the baseline
        working-directory: src/tests
        run: python check_coverage.py coverage.json
