# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# This build only renders the documentation. Notebooks are committed with their outputs (nb_execution_mode in
# docs/source/conf.py), so nothing is executed here. The package is installed with its `docs` extra because autodoc
# imports it to read docstrings. The strict (warnings-as-errors) build runs in CI.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false
